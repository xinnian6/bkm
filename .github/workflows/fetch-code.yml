name: Fetch Pokemon Airport Code

# 注意:GitHub runner 的 IP 段被 linux.do 的 Cloudflare 硬拦,
# headless Chrome 过不了 JSON 端点(实测反复 no_matching_topic)。
# 所以定时跑改由本地 Windows 计划任务 auto_push.py 接管(本地 IP 放行)。
# 这个 workflow 保留手动触发,方便偶尔在 runner 上试/对比。
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-code
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Chrome
        run: |
          # ubuntu-22.04 runner 自带 google-chrome-stable;没有就装
          if ! command -v google-chrome >/dev/null 2>&1; then
            wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get install -y /tmp/chrome.deb || sudo apt --fix-broken install -y
          fi
          echo "CHROME_PATH=$(command -v google-chrome || command -v chromium)" >> $GITHUB_ENV

      - name: Install Python deps
        run: |
          pip install -r gh_actions_fetcher/requirements.txt

      - name: Run fetcher
        id: run
        continue-on-error: true
        env:
          CHROME_PATH: ${{ env.CHROME_PATH }}
        run: |
          python gh_actions_fetcher/fetch_code.py
          echo "fetch exit: $?"

      - name: Show result
        if: always()
        run: |
          echo "=== current_code.json ==="
          cat current_code.json || echo "(no json)"
          echo ""
          echo "=== latest.md ==="
          cat latest.md || echo "(no md)"

      - name: Commit result
        # 只有 fetch_code.py 写了 .fetch_success 标记(=拿到码)才覆盖远程 JSON
        # 失败时绝不 commit,保留仓库里上次的成功码
        if: hashFiles('.fetch_success') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add current_code.json latest.md
          if git diff --cached --quiet; then
            echo "无变化,跳过 commit"
          else
            git commit -m "chore: update pokemon airport code ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi
